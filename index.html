<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: start center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #1a2027;
    padding: clamp(16px, 5vw, 48px) clamp(16px, 5vw, 24px);
  }
  @media (prefers-color-scheme: dark) {
    body { background: #121820; color: #e8eef5; }
    .caja { background: #1b232e !important; border-color: #2b3644 !important; }
    .hueco { border-color: #35435a !important; background: #161e28 !important; }
  }
  .hoja { width: 100%; max-width: 560px; }
  .caja {
    background: #fff; border: 1px solid #dde3ea; border-radius: 14px;
    padding: clamp(20px, 6vw, 34px);
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.3);
  }
  h1 {
    font-size: clamp(24px, 7vw, 30px);
    line-height: 1.2; margin: 0 0 10px;
  }
  .entrada { margin: 0; line-height: 1.55; font-size: clamp(15px, 4vw, 17px); }
  .hueco {
    margin-top: clamp(20px, 6vw, 28px);
    border: 2px dashed #c6d0da; border-radius: 12px;
    background: #fafbfc;
    padding: clamp(22px, 7vw, 32px) 18px;
    text-align: center;
  }
  .rotulo {
    font-size: 12px; letter-spacing: .09em; text-transform: uppercase;
    opacity: .65; margin: 0 0 6px;
  }
  .hueco p:last-child { margin: 0; font-size: 14px; opacity: .8; line-height: 1.5; }
</style>
</head>
<body>
  <div class="hoja">
    <div class="caja">

      <h1>Buzón de sugerencias</h1>
      <p class="entrada">Un lugar para dejar por escrito lo que se puede hacer mejor,
        sin tener que esperar a la siguiente junta.</p>

      <div class="hueco">
        <p class="rotulo">Espacio reservado</p>
        <p>Aquí va el formulario. Todavía no está puesto.</p>
      </div>

    </div>
  </div>
</body>
</html>
